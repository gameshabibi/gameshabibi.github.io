<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games Habibi — Moving to gameshabibi.vercel.app</title>
  <meta name="description" content="Games Habibi has moved to gameshabibi.vercel.app. Redirecting you to the official store.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://gameshabibi.vercel.app">
  <meta http-equiv="refresh" content="0; url=https://gameshabibi.vercel.app">
  <script>
    (function() {
      var targetHost = "https://gameshabibi.vercel.app";
      var path = window.location.pathname || "";
      var search = window.location.search || "";
      var hash = window.location.hash || "";

      // Handle legacy hash routes (e.g. #/cart, #/games, #/orders)
      if (hash.startsWith("#/")) {
        var subRoute = hash.slice(2);
        var subParts = subRoute.split("?");
        var cleanRoute = subParts[0];
        var hashSearch = subParts[1] ? ("?" + subParts[1]) : "";
        var query = search || hashSearch;

        if (cleanRoute === "cart") {
          window.location.replace(targetHost + "/cart" + query);
          return;
        } else if (cleanRoute === "orders") {
          window.location.replace(targetHost + "/orders" + query);
          return;
        } else if (cleanRoute === "games") {
          window.location.replace(targetHost + "/games" + query);
          return;
        } else if (cleanRoute === "guides" || cleanRoute === "guide") {
          window.location.replace(targetHost + "/guide" + query);
          return;
        } else if (cleanRoute === "collections") {
          window.location.replace(targetHost + "/catalog" + query);
          return;
        } else if (cleanRoute.startsWith("policy/")) {
          var pol = cleanRoute.replace("policy/", "");
          if (pol === "refunds") pol = "cancellation";
          window.location.replace(targetHost + "/" + pol + query);
          return;
        }
      }

      // Normalize root path
      if (path === "/" || path === "/index.html") {
        path = "";
      }

      var destination = targetHost + path + search + hash;
      window.location.replace(destination);
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0914;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(22, 18, 38, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.3);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.25rem;
      display: inline-block;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 1.5rem;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      font-size: 0.95rem;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 0.6rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <div class="logo">Games Habibi</div>
    <h1>Redirecting you to our new store…</h1>
    <p>Games Habibi has migrated to our official Next.js storefront. You are being redirected automatically to <strong>gameshabibi.vercel.app</strong>.</p>
    <a id="redirect-link" class="btn" href="https://gameshabibi.vercel.app">Click here if not redirected</a>
  </div>
  <script>
    // Update button target to destination if path/query existed
    (function() {
      var link = document.getElementById("redirect-link");
      if (link && window.location.pathname) {
        var path = window.location.pathname === "/index.html" ? "" : window.location.pathname;
        link.href = "https://gameshabibi.vercel.app" + path + window.location.search + window.location.hash;
      }
    })();
  </script>
</body>
</html>
